<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데이트 코스</title>
<meta name="description" content="연인과 공유하는 데이트 코스 타임라인">
<meta name="theme-color" content="#e85d75" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a161c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="데이트 코스">
<style>
  /* --- render_course.py의 <style> 이식 --- */
  :root {
    --bg: #fbf7f5; --card: #ffffff; --ink: #2b2431; --muted: #7a6f78;
    --line: #ecdfe2; --accent: #e85d75; --peak: #f0a202; --finale: #9b5de5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a161c; --card:#241f28; --ink:#f2ecf0; --muted:#a99fa8;
            --line:#3a3340; --accent:#ff7a90; }
    .cover { background:linear-gradient(140deg, hsl(var(--hue) 44% 44%), hsl(var(--hue) 42% 32%)); }
  }
  :root[data-theme="light"] { --bg:#fbf7f5; --card:#fff; --ink:#2b2431; --muted:#7a6f78; --line:#ecdfe2; }
  :root[data-theme="dark"]  { --bg:#1a161c; --card:#241f28; --ink:#f2ecf0; --muted:#a99fa8; --line:#3a3340; --accent:#ff7a90; }
  :root[data-theme="light"] .cover { background:linear-gradient(140deg, hsl(var(--hue) 60% 80%), hsl(var(--hue) 55% 64%)); }
  :root[data-theme="dark"]  .cover { background:linear-gradient(140deg, hsl(var(--hue) 44% 44%), hsl(var(--hue) 42% 32%)); }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height:1.55; -webkit-text-size-adjust:100%; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 24px; }
  .course { background: var(--card); border:1px solid var(--line); border-radius:16px;
    padding: 20px 20px 16px; margin-bottom: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .course h2 { font-size: 1.2rem; margin: 0 0 2px; }
  .concept { color: var(--muted); margin: 0 0 12px; font-size:.95rem; }
  .facts { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.85rem; color:var(--muted); margin-bottom:14px; }
  .timeline { list-style:none; margin:0; padding:0; position:relative; }
  .timeline::before { content:""; position:absolute; left:7px; top:6px; bottom:6px;
    width:2px; background:var(--line); }
  .stop { position:relative; padding: 0 0 4px 30px; }
  .dot { position:absolute; left:0; top:5px; width:16px; height:16px; border-radius:50%;
    background:var(--card); border:3px solid var(--accent); }
  .stop-head { display:flex; align-items:center; gap:8px; }
  .time { font-weight:700; color:var(--accent); font-variant-numeric: tabular-nums; }
  .stop-name { font-weight:600; font-size:1.02rem; margin-top:1px; }
  .stop-name a { color:inherit; text-decoration:none; border-bottom:1px solid var(--line); }
  .stop-reason { color:var(--ink); opacity:.85; font-size:.92rem; margin-top:2px; }
  .stop-meta { color:var(--muted); font-size:.82rem; margin-top:2px; }
  .move-row { list-style:none; }
  .move { padding: 6px 0 6px 30px; color:var(--muted); font-size:.82rem; }
  .badge { font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:999px; color:#fff; }
  .badge.peak { background: var(--peak); }
  .badge.finale { background: var(--finale); }
  .note { margin-top:10px; padding:10px 12px; background:var(--bg); border-radius:10px;
    font-size:.88rem; color:var(--ink); opacity:.92; }
  .outfit { margin-top:10px; padding:10px 12px; background:var(--bg); border-radius:10px;
    font-size:.88rem; color:var(--ink); }
  .outfit-head { font-weight:700; }
  .outfit-items { margin-top:4px; }
  .outfit-swap { margin-top:4px; color:var(--finale); }
  .outfit-why { margin-top:4px; color:var(--muted); }
  .outfit-check { margin-top:4px; color:var(--muted); font-size:.82rem; }
  a { color: var(--accent); }
  /* --- 심리 근거 칩(코스 안) --- */
  .factors-why { margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .why-label { font-size:.8rem; color:var(--muted); margin-right:2px; }
  a.chip { font-size:.78rem; padding:3px 10px; border-radius:999px; text-decoration:none;
    border:1px solid var(--accent); color:var(--accent); background:transparent; }
  a.chip:active { background:var(--accent); color:#fff; }
  /* --- 상단 내비 --- */
  .topnav { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:16px; font-size:.9rem; }
  .topnav a { color:var(--accent); text-decoration:none; }
  /* --- 아카이브 카드(커버 + 본문 2단) --- */
  .arch-card { display:flex; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; margin-bottom:12px; text-decoration:none; color:inherit;
    box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .arch-card .date { color:var(--accent); font-weight:700; font-size:.82rem; font-variant-numeric:tabular-nums; }
  .arch-card .t { font-weight:600; font-size:1.05rem; margin-top:2px; }
  .arch-card .m { color:var(--muted); font-size:.85rem; margin-top:2px; }
  .arch-body { min-width:0; }   /* flex 자식의 긴 텍스트가 카드를 밀지 않게 */
  /* 커버 — 사진 대신 지역별 색으로 카드를 구분한다. --hue는 app.js의 regionHue가 넣는다. */
  .cover { flex:0 0 62px; height:62px; border-radius:12px; display:flex;
    align-items:center; justify-content:center; font-size:1.85rem; line-height:1;
    background:linear-gradient(140deg, hsl(var(--hue) 60% 80%), hsl(var(--hue) 55% 64%)); }
  .cover.no-region { background:linear-gradient(140deg, var(--line), var(--muted)); }
  /* --- 카드 뱃지 --- */
  .bdgs { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .bdg { font-size:.72rem; padding:2px 8px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); }
  .bdg-region { border-color:transparent; color:#fff; background:hsl(var(--hue) 42% 46%); }
  .bdg-icon { border-color:transparent; padding:2px 5px; }
  /* --- 필터 칩 --- */
  .fchips { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 16px; }
  a.fchip { font-size:.78rem; padding:4px 11px; border-radius:999px; text-decoration:none;
    border:1px solid var(--line); color:var(--muted); background:transparent; }
  a.fchip.on { border-color:var(--accent); color:#fff; background:var(--accent); }
  /* --- 연도 헤딩(연도가 2개 이상일 때만 렌더된다) --- */
  h2.year { font-size:.95rem; color:var(--muted); margin:24px 0 8px;
    font-variant-numeric:tabular-nums; }
  /* --- 요인 상세 / 목록 --- */
  .factor-detail .cat { color:var(--muted); font-size:.8rem; }
  .factor-block { margin-top:16px; }
  .factor-block h3 { font-size:.92rem; color:var(--accent); margin:0 0 4px; }
  .factor-block p { margin:0; white-space:pre-line; opacity:.92; }
  .factor-group { margin-top:22px; }
  .factor-group h2 { font-size:1rem; margin:0 0 4px; padding-bottom:5px; border-bottom:1px solid var(--line); }
  .factor-list a { display:block; padding:10px 0; border-bottom:1px solid var(--line);
    text-decoration:none; color:inherit; }
  .factor-list .fn { font-weight:600; display:block; }
  .factor-list .fs { color:var(--muted); font-size:.85rem; display:block; margin-top:2px; }
  code { background:var(--line); padding:1px 5px; border-radius:5px; font-size:.85em; }
  /* --- 빈 상태 / 오류 --- */
  .empty { text-align:center; padding:40px 8px; color:var(--muted); }
  .empty h1 { color:var(--ink); font-size:1.5rem; }
  .empty p { margin:10px 0; }
  .empty .hint { font-size:.85rem; opacity:.8; }
</style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script src="app.js"></script>
</body>
</html>
